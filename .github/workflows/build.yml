name: Build ZephyrMC Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
        
    - name: Fix Firebase plugins in app/build.gradle.kts
      run: |
        sed -i '/id("com.google.gms.google-services")/d' app/build.gradle.kts
        sed -i '/id("com.google.firebase.crashlytics")/d' app/build.gradle.kts
        sed -i '/com\.google\.firebase/d' app/build.gradle.kts
        
    - name: Create mock google-services.json
      run: |
        mkdir -p app
        cat << 'EOF' > app/google-services.json
        {
          "project_info": {
            "project_number": "123456789",
            "project_id": "mock-project",
            "storage_bucket": "mock.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:123456789:android:abc123",
                "android_client_info": {
                  "package_name": "com.project.zephyr.client"
                }
              },
              "api_key": [{ "current_key": "mock-key" }]
            }
          ]
        }
        EOF
        
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ZephyrMC-Debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7
